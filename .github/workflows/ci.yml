name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build-test:
    name: Build, vet, and test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.25"
          cache: true

      # clang is the only external dependency for compiling
      # bpf/programs/*.c: see bpf/headers/README.md for why no other
      # libbpf/kernel-header packages are needed.
      - name: Install eBPF build toolchain (clang)
        run: sudo apt-get update && sudo apt-get install -y clang

      # Regenerates internal/ebpf's bpf2go bindings from
      # bpf/programs/foundation.c. Not committed to the repo — see
      # ADR-007 in docs/design/decisions.md.
      - name: Generate eBPF bindings
        run: go generate ./...

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

      - name: Check formatting
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "The following files are not gofmt-formatted:"
            echo "$unformatted"
            exit 1
          fi

      - name: Test (race detector, coverage)
        run: go test ./... -race -coverprofile=coverage.out

      - name: Coverage summary
        run: go tool cover -func=coverage.out | tail -n 1

      # Loading a BPF program requires root (or CAP_BPF+CAP_PERFMON) on
      # most kernels. The unprivileged run above already exercises each
      # package's platform-independent contract; this step re-runs just
      # the loader tests with root to exercise the real load -> attach
      # -> receive -> detach lifecycle against the runner's actual
      # kernel, including the real-TCP-connect, real-TCP-close,
      # real-HTTP-write, and real-DNS-query/response integration tests.
      - name: Test eBPF loaders (privileged)
        run: sudo -E env "PATH=$PATH" go test ./internal/ebpf/... ./internal/process/... ./internal/network/... ./internal/socket/... ./internal/httpvis/... ./internal/dns/... -v -run TestLoader

  kafka-integration:
    name: Kafka integration tests
    runs-on: ubuntu-latest
    # apache/kafka's official image runs a single-node KRaft broker
    # (no separate ZooKeeper container needed) with sensible defaults
    # when started with no extra configuration, listening on 9092 — see
    # docs/design/kafka-transport.md for why this is the one piece of
    # this project's CI that needed a service container rather than
    # running everywhere: there is no Kafka broker, and no Docker to
    # run one, on this project's Windows dev machine.
    services:
      kafka:
        image: apache/kafka:3.7.0
        ports:
          - 9092:9092
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.25"
          cache: true

      # The service container starts in parallel with this job's own
      # setup steps, not necessarily before them; give the broker a
      # moment to finish its own startup before the first test dials
      # it, rather than relying on the very first connection attempt's
      # own retry/timeout behavior to paper over that.
      - name: Wait for Kafka to accept connections
        run: |
          for i in $(seq 1 30); do
            if (exec 3<>/dev/tcp/localhost/9092) 2>/dev/null; then
              exec 3<&- 3>&-
              exit 0
            fi
            sleep 2
          done
          echo "Kafka never became reachable on localhost:9092" >&2
          exit 1

      # Runs with output captured to a file rather than straight to the
      # job log: this project has no authenticated GitHub access (no
      # `gh auth login` completed, no repo-admin API access), and the
      # Actions log-download API refuses an unauthenticated read on
      # this public repo — but a `::error::` workflow command *does*
      # surface as a check-run annotation, which the public API allows
      # reading. On failure, emit the tail of the actual test output
      # that way, so a failure here is actually diagnosable rather than
      # only ever showing "Process completed with exit code 1".
      - name: Test internal/kafka (real broker)
        run: |
          if ! go test ./internal/kafka/... -v -count=1 2>&1 | tee test-output.log; then
            # GitHub's ::error:: command needs %, \r, \n percent-encoded
            # to render a multi-line message in one annotation — % must
            # be escaped first, or the %0D/%0A this introduces would
            # themselves get mangled by a later %-escape pass.
            msg="$(tail -c 3000 test-output.log | sed -e 's/%/%25/g' | sed -e ':a;N;$!ba' -e 's/\r/%0D/g' -e 's/\n/%0A/g')"
            echo "::error::${msg}"
            exit 1
          fi
        env:
          PULSE_TEST_KAFKA_BROKERS: localhost:9092

  clickhouse-integration:
    name: ClickHouse integration tests
    runs-on: ubuntu-latest
    # clickhouse/clickhouse-server's official image runs a single-node
    # server with sensible defaults (native protocol on 9000, HTTP on
    # 8123, "default" user/no password) when started with no extra
    # configuration — see docs/design/clickhouse-storage.md for why
    # this needed a service container rather than running everywhere,
    # same reasoning as kafka-integration above.
    services:
      clickhouse:
        image: clickhouse/clickhouse-server:24.8
        ports:
          - 9000:9000
          - 8123:8123
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.25"
          cache: true

      - name: Wait for ClickHouse to accept connections
        run: |
          for i in $(seq 1 30); do
            if (exec 3<>/dev/tcp/localhost/9000) 2>/dev/null; then
              exec 3<&- 3>&-
              exit 0
            fi
            sleep 2
          done
          echo "ClickHouse never became reachable on localhost:9000" >&2
          exit 1

      # internal/topology (Day 16) and internal/cli's own topology
      # tests query the same real ClickHouse server, so they run here
      # too rather than spinning up a second, redundant service
      # container just for them. See internal/kafka's identical step
      # above for why output is captured and surfaced via ::error::
      # rather than relying on the (unauthenticated-inaccessible) raw
      # job log.
      - name: Test internal/storage, internal/topology, internal/cli (real ClickHouse)
        run: |
          if ! go test ./internal/storage/... ./internal/topology/... ./internal/cli/... -v -count=1 2>&1 | tee test-output.log; then
            msg="$(tail -c 3000 test-output.log | sed -e 's/%/%25/g' | sed -e ':a;N;$!ba' -e 's/\r/%0D/g' -e 's/\n/%0A/g')"
            echo "::error::${msg}"
            exit 1
          fi
        env:
          PULSE_TEST_CLICKHOUSE_ADDR: localhost:9000

  grafana-integration:
    name: Grafana dashboard validation
    runs-on: ubuntu-latest
    # grafana-oss's official image runs a single-node Grafana server
    # with sensible defaults; admin credentials are set explicitly
    # below (env) rather than relying on the image's own defaults,
    # since basic-auth API calls need to know them for certain. See
    # docs/design/dashboards.md for why this validates the dashboard
    # JSON against a real server via Grafana's own HTTP API, rather
    # than only checking that the files parse as JSON.
    services:
      grafana:
        image: grafana/grafana-oss:11.3.0
        ports:
          - 3000:3000
        env:
          GF_SECURITY_ADMIN_USER: admin
          GF_SECURITY_ADMIN_PASSWORD: pulse-ci-test
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Wait for Grafana to become ready
        run: |
          for i in $(seq 1 30); do
            if curl -sf http://localhost:3000/api/health >/dev/null 2>&1; then
              exit 0
            fi
            sleep 2
          done
          echo "Grafana never became ready on localhost:3000" >&2
          exit 1

      # Creates the Prometheus datasource every checked-in dashboard's
      # panels reference (by the placeholder uid
      # PULSE_PROMETHEUS_DATASOURCE_UID — see
      # deployments/grafana/dashboards/*.json), then imports each
      # dashboard with that placeholder substituted for the datasource
      # Grafana actually assigned. The datasource's own url doesn't
      # need to resolve to anything real for this: creating a
      # datasource and importing a dashboard that references it are
      # both accepted by Grafana's API without it ever being queried,
      # the same way saving a datasource in the UI doesn't require
      # clicking "Save & Test". What this step actually proves is
      # narrower but real: every dashboard file is well-formed and
      # Grafana itself accepts its panel/target structure — not that
      # the PromQL queries return sensible data against live metrics,
      # which nothing in CI produces.
      - name: Import dashboards into Grafana
        run: |
          auth="admin:pulse-ci-test"

          ds_response="$(curl -sf -u "$auth" -X POST http://localhost:3000/api/datasources \
            -H 'Content-Type: application/json' \
            -d '{"name":"Prometheus","type":"prometheus","access":"proxy","url":"http://localhost:9090","isDefault":true}')"
          ds_uid="$(echo "$ds_response" | jq -r '.datasource.uid')"
          if [ -z "$ds_uid" ] || [ "$ds_uid" = "null" ]; then
            echo "::error::failed to create Prometheus datasource: $ds_response"
            exit 1
          fi
          echo "created datasource with uid $ds_uid"

          status=0
          for f in deployments/grafana/dashboards/*.json; do
            echo "importing $f"
            dashboard="$(sed "s/PULSE_PROMETHEUS_DATASOURCE_UID/$ds_uid/g" "$f")"
            body="$(jq -n --argjson dashboard "$dashboard" '{dashboard: $dashboard, overwrite: true}')"
            resp="$(curl -s -u "$auth" -w '\n%{http_code}' -X POST http://localhost:3000/api/dashboards/db \
              -H 'Content-Type: application/json' -d "$body")"
            code="$(echo "$resp" | tail -n1)"
            payload="$(echo "$resp" | sed '$d')"
            if [ "$code" != "200" ]; then
              echo "::error::importing $f failed (HTTP $code): $payload"
              status=1
            else
              echo "$f imported successfully: $payload"
            fi
          done
          exit $status
