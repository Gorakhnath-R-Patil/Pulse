# Example configuration for pulse-agent.
#
# All fields are optional — pulse-agent runs with sane defaults if no
# config file is given at all (`pulse-agent` with no --config flag).
# Copy this file, edit what you need, and pass it with:
#
#   pulse-agent --config agent.yaml
#
# See docs/development/configuration.md for the full field reference and
# environment variable overrides.

# Identifies this host in emitted telemetry. Defaults to the OS hostname.
node_name: pulse-node-1

logging:
  # One of: debug, info, warn, error.
  level: info
  # One of: json (machine-readable, production default), text (human-readable).
  format: json

# OTLP/gRPC collector address to export correlated spans to, e.g.
# "localhost:4317". Uncomment to enable export — left unset (the
# default), pulse-agent never dials a collector at all. See
# docs/design/otlp-export.md.
# otlp_endpoint: localhost:4317

# Kafka broker addresses and topic to produce every captured event to.
# Uncomment both to enable production — left unset (the default),
# pulse-agent never dials a broker at all. See
# docs/design/kafka-transport.md.
# kafka_brokers:
#   - localhost:9092
# kafka_topic: pulse-events

# Address to serve Prometheus metrics on at /metrics, e.g. ":9090".
# Uncomment to enable — left unset (the default), pulse-agent never
# opens a listener nobody asked for. See docs/design/metrics.md.
# metrics_addr: ":9090"
